<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071a33">
    <title>Find flights — Skylane</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="site-nav">
    <a class="brand" href="index.html"><span class="brand-mark">✈</span> skylane<span class="brand-period">.</span></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primaryNavLinks" aria-label="Open navigation"><span></span><span></span><span></span></button>
    <div class="nav-links" id="primaryNavLinks"><a href="index.html">Discover</a><a class="active" href="flights.html">Flights</a><a href="bookings.html">My bookings</a><a href="dsa.html">DSA Lab</a></div>
    <a class="nav-admin" href="admin.html">Admin <span aria-hidden="true">↗</span></a>
</nav>
<main class="page-width content-page">
    <div class="page-intro"><div><p class="eyebrow eyebrow-dark">YOUR NEXT DEPARTURE</p><h1>Find your flight.</h1><p class="page-subtitle">A better view of what’s taking off.</p></div><a class="text-link" href="index.html">← Back to discover</a></div>
    <div id="alert" class="alert" role="status"></div>
    <section class="flight-filter card">
        <label class="filter-field"><span>FROM</span><input id="sourceFilter" type="text" placeholder="Any city" list="flightCities" autocomplete="off"></label>
        <label class="filter-field"><span>TO</span><input id="destinationFilter" type="text" placeholder="Any destination" list="flightCities" autocomplete="off"></label>
        <label class="filter-field"><span>DEPARTURE DATE</span><input id="dateFilter" type="date"></label>
        <button id="searchBtn" class="btn btn-primary" type="button">Search flights <span>→</span></button>
        <datalist id="flightCities"></datalist>
    </section>
    <div id="activeFilters" class="active-filters" aria-label="Active search filters" hidden></div>
    <div class="results-heading"><div><h2 id="resultsTitle">Available flights</h2><p id="resultsCount" class="muted-copy">Loading flights…</p></div>
        <label class="sort-control"><span>Sort by</span><select id="sortBy" aria-label="Sort flights"><option value="">Recommended</option><option value="price">Lowest price</option><option value="time">Earliest departure</option><option value="duration">Shortest duration</option></select></label>
    </div>
    <div id="loader" class="flight-skeleton-list" role="status" aria-label="Loading flights"><span class="skeleton-line"></span><span class="skeleton-line"></span><span class="skeleton-line"></span></div>
    <div id="flightList" class="flight-list"></div>
</main>
<footer class="site-footer"><a class="brand" href="index.html"><span class="brand-mark">✈</span> skylane<span class="brand-period">.</span></a><span>Made for the places that stay with you.</span><a href="bookings.html">Your bookings →</a></footer>
<script src="js/api.js"></script>
<script src="js/navigation.js"></script>
<script src="js/flights.js"></script>
</body>
</html>
