<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071a33">
    <title>Your bookings — Skylane</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="site-nav">
    <a class="brand" href="index.html"><span class="brand-mark">✈</span> skylane<span class="brand-period">.</span></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primaryNavLinks" aria-label="Open navigation"><span></span><span></span><span></span></button>
    <div class="nav-links" id="primaryNavLinks"><a href="index.html">Discover</a><a href="flights.html">Flights</a><a class="active" href="bookings.html">My bookings</a><a href="dsa.html">DSA Lab</a></div>
    <a class="nav-admin" href="admin.html">Admin <span aria-hidden="true">↗</span></a>
</nav>
<main class="page-width content-page">
    <div class="page-intro"><div><p class="eyebrow eyebrow-dark">YOUR TRAVEL, IN ONE PLACE</p><h1>Trips worth keeping.</h1><p class="page-subtitle">View a booking by entering the email used to reserve.</p></div><a class="text-link" href="flights.html">Find a flight <span>→</span></a></div>
    <div id="alert" class="alert" role="status"></div>
    <section class="card booking-search-card">
        <label class="filter-field booking-email-field"><span>BOOKING EMAIL</span><input id="emailFilter" type="email" autocomplete="email" placeholder="Enter the email used to book"></label>
        <button id="searchBtn" type="button" class="btn btn-primary">View bookings <span>→</span></button>
        <button id="showAllBtn" type="button" class="btn btn-quiet">Show all</button>
    </section>
    <div class="booking-filters" role="group" aria-label="Filter bookings by status">
        <button type="button" class="booking-filter is-active" data-status="all" aria-pressed="true">All bookings</button>
        <button type="button" class="booking-filter" data-status="confirmed" aria-pressed="false">Confirmed</button>
        <button type="button" class="booking-filter" data-status="cancelled" aria-pressed="false">Cancelled</button>
    </div>
    <div class="results-heading"><div><h2>Your reservations</h2><p id="bookingCount" class="muted-copy">Loading bookings…</p></div></div>
    <div id="bookingLoader" class="booking-skeleton-list" role="status" aria-label="Loading bookings" hidden><span class="skeleton-line"></span><span class="skeleton-line"></span></div>
    <div id="bookingList" class="booking-list"></div>
</main>
<footer class="site-footer"><a class="brand" href="index.html"><span class="brand-mark">✈</span> skylane<span class="brand-period">.</span></a><span>Made for the places that stay with you.</span><a href="flights.html">Find a flight →</a></footer>
<script src="js/api.js"></script>
<script src="js/navigation.js"></script>
<script src="js/bookings.js"></script>
</body>
</html>
